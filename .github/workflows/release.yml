name: Release

# Builds installable artifacts and attaches them to a GitHub Release.
#
# This project is distributed through GitHub, not PyPI. Users install with
# `pip install <url-to-wheel>` or `pip install git+https://...`. There is no
# publishing step here; if you later decide to publish to PyPI, add a job
# using pypa/gh-action-pypi-publish with trusted publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Confirm the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          # The built sdist name carries the version hatchling used.
          sdist = next(Path("dist").glob("*.tar.gz"))
          version = sdist.name.removeprefix("tpsreg-").removesuffix(".tar.gz")

          if tag != version:
              print(f"::error::tag v{tag} does not match packaged version {version}")
              print("Update [project].version in pyproject.toml, or retag.")
              sys.exit(1)

          print(f"tag and package version agree: {version}")
          PY

      # The wheel is what users download, so prove it installs and runs before
      # attaching it to a release.
      - name: Install the wheel in a clean environment and smoke test it
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install --upgrade pip
          /tmp/release-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/release-check/bin/python -c "
          import tpsreg
          from tpsreg.resources_util import theme_path
          print('version:', tpsreg.__version__)
          assert theme_path('dark').exists(), 'packaged theme is missing'
          print('wheel smoke test OK')
          "

      - name: Confirm no non-commercially-licensed code is bundled
        run: |
          count=$(grep -rl "CC BY-NC-SA" src/ 2>/dev/null | wc -l)
          if [ "$count" -ne 0 ]; then
            echo "::error::$count file(s) under src/ are licensed CC BY-NC-SA."
            echo "These must not be redistributed under this project's MIT license."
            grep -rl "CC BY-NC-SA" src/
            exit 1
          fi
          echo "No non-commercially-licensed files bundled."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Attach artifacts to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Tags are "v0.2.0" but wheels are named "tpsreg-0.2.0-...", so the
      # leading v has to come off before building the download URL.
      - name: Derive the package version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Installation

            Requires Python 3.11 or newer.

            Install directly from this release:

            ```
            pip install https://github.com/lambjames18/tps-image-registration-gui/releases/download/${{ github.ref_name }}/tpsreg-${{ steps.version.outputs.value }}-py3-none-any.whl
            ```

            Or download `tpsreg-${{ steps.version.outputs.value }}-py3-none-any.whl`
            from the assets below and install it locally:

            ```
            pip install tpsreg-${{ steps.version.outputs.value }}-py3-none-any.whl
            ```

            Then run `tpsreg` to launch the application.

            On Linux you also need Tk: `sudo apt install python3-tk`.
