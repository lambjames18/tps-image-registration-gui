[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpsreg"
version = "0.2.0"
description = "GUI application for registration of multimodal image data using a thin plate spline transformation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "James Lamb", email = "lambjames18@gmail.com" }]
keywords = [
    "microscopy",
    "image-registration",
    "thin-plate-spline",
    "EBSD",
    "multimodal",
    "electron-microscopy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Core dependencies deliberately exclude torch: loading data, manual point
# selection, TPS estimation, preview and every export path work without it.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
# CLAHE and resolution matching use kornia/torchvision when installed and fall
# back to scikit-image implementations otherwise.
accelerated = [
    "torch>=2.2",
    "torchvision>=0.17",
    "kornia>=0.7",
]
# Automatic point detection with the vendored MatchAnything/ROMA model.
matchanything = [
    "torch>=2.2",
    "torchvision>=0.17",
    "kornia>=0.7",
    "pytorch-lightning>=2.0",
    "einops>=0.7",
    "loguru>=0.7",
    "yacs>=0.1.8",
    "opencv-python-headless>=4.8",
    "joblib",
]

[project.scripts]
tpsreg = "tpsreg.cli:main"

[project.urls]
Homepage = "https://github.com/lambjames18/tps-image-registration-gui"
Repository = "https://github.com/lambjames18/tps-image-registration-gui"
Issues = "https://github.com/lambjames18/tps-image-registration-gui/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    # Used by tests/test_workflows.py to parse the GitHub Actions files.
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tpsreg"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gui: tests that require a working Tk display",
    "slow: tests that take more than a few seconds",
    "torch: tests that require the optional torch dependencies",
]

[tool.coverage.run]
source = ["tpsreg"]
omit = [
    # Vendored upstream code, not ours to cover.
    "*/Matchanything/*",
    # The Tk view. Its behaviour is exercised by the smoke tests in
    # tests/test_gui.py, but line coverage of widget construction measures
    # very little and its size (1400 statements) would dominate the headline
    # number for the logic that is actually under test.
    "*/tpsreg/GUI.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# The vendored MatchAnything tree is upstream code and is not linted.
extend-exclude = ["src/tpsreg/Matchanything"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
]
ignore = [
    "E501",    # line length is enforced by the formatter
    "B008",    # function calls in argument defaults
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["tpsreg"]
